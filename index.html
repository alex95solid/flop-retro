<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOP 80s Terminal</title>
    <style>
        body {
            background-color: #081226;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .terminal-box {
            background-color: #040a17;
            border: 2px solid #33ff33;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.2);
            border-radius: 4px;
            padding: 50px;
            text-align: center;
        }
        pre {
            margin: 0;
            line-height: 1.3;
            font-size: 16px;
            font-weight: bold;
            white-space: pre;
            text-shadow: 0 0 5px rgba(51, 255, 51, 0.5);
        }
        .tagline {
            color: #ffffff;
            margin-top: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
<pre>
 ______   _         ______   _______  
|  ____| | |       |  __  | |  ___  | 
| |__    | |       | |  | | | |___| | 
|  __|   | |       | |  | | |  _____| 
| |      | |_____  | |__| | | |       
|_|      |_______| |______| |_|       
</pre>
        <div class="tagline">$FLOP is food for your AI agent.</div>
    </div>

</body>
</html>
